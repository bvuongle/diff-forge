name: Validate packaged app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the .deb (default 0.0.0-dev)'
        required: false
        default: '0.0.0-dev'
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        default: '0.0.0-dev'
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp version
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build renderer + main
        run: pnpm build
      - name: Package .deb
        run: pnpm exec electron-builder --linux deb --publish never
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: diff-forge-deb
          path: release/*.deb
          if-no-files-found: error
          retention-days: 7

  e2e-ubuntu-native:
    name: E2E packaged (ubuntu-native)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: diff-forge-deb
          path: ./release
      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install .deb
        run: sudo apt-get install -y ./release/*.deb
      - name: Verify binary exists
        run: |
          test -x /opt/diff-forge/diff-forge
          ls -l /opt/diff-forge/chrome-sandbox
      - name: Run packaged-app spec
        env:
          DIFF_FORGE_BIN: /opt/diff-forge/diff-forge
        run: xvfb-run -a pnpm exec playwright test app.spec.ts
      - name: Upload screenshots and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ubuntu-native-results
          path: tests/e2e/test-results/
          retention-days: 7
